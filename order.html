<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order | AMAI</title>
    <style>
      :root {
        --bg: #dddedc;
        --ink: #1a1a1a;
        --muted: #6b6d6a;
        --line: #bfc1be;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 40px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      header a:hover {
        opacity: 0.6;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 80px;
        text-align: center;
      }
      .logo {
        width: min(200px, 50%);
        margin-bottom: 40px;
      }
      .logo img {
        width: 100%;
        display: block;
      }
      h1 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .sub {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 18px;
        margin-bottom: 34px;
      }
      ul {
        list-style: none;
        width: min(520px, 100%);
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 26px 8px;
        border-bottom: 1px solid var(--line);
      }
      .city {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .btn {
        display: inline-block;
        padding: 11px 22px;
        border: 1px solid var(--ink);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .btn:hover {
        background: var(--ink);
        color: var(--bg);
      }
      .soon {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      @media (max-width: 560px) {
        header {
          padding: 20px;
        }
        li {
          padding: 22px 4px;
        }
        .city {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">&larr; Home</a><a href="/locations">Locations</a>
    </header>
    <main>
      <a class="logo" href="/"><img src="images/logo.png" alt="AMAI" /></a>
      <h1>Order</h1>
      <p class="sub">Choose your location</p>
      <ul>
        <li>
          <span class="city">Santa Monica</span
          ><a
            class="btn"
            href="https://amaisantamonica.square.site/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Glendale</span
          ><a
            class="btn"
            href="https://amaiglendale.square.site/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Torrance</span
          ><a
            class="btn"
            href="https://amaiteacafe.com/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Huntington Beach</span
          ><a
            class="btn"
            href="https://amaihuntingtonbeach.square.site/?location=L1HZJ0J1RMFHA"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Sherman Oaks</span
          ><span class="soon">Coming soon</span>
        </li>
      </ul>
    </main>
  </body>
</html>
