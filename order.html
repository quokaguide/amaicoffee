<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order | AMAI</title>
    <style>
      @font-face {
        font-family: "Gloock";
        src: url(fonts/gloock.woff2) format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --bg: #faf9f6;
        --ink: #1a1a1a;
        --muted: #6b6d6a;
        --line: #d9d7d2;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        background: #faf9f6;
      }
      body {
        color: var(--ink);
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-synthesis: none;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          180deg,
          #faf9f6 0%,
          #f9f7f3 70%,
          #f3eee8 100%
        );
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 40px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      header a:hover {
        opacity: 0.6;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(250, 249, 246, 0.6);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 80px;
        text-align: center;
      }
      .logo {
        width: min(200px, 50%);
        margin-bottom: 40px;
      }
      .logo img {
        width: 100%;
        display: block;
      }
      h1 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .sub {
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-size: 18px;
        margin-bottom: 34px;
      }
      ul {
        list-style: none;
        width: min(520px, 100%);
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 26px 8px;
        border-bottom: 1px solid var(--line);
      }
      .city {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .btn {
        display: inline-block;
        padding: 11px 22px;
        border: 1px solid var(--ink);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .btn:hover {
        background: var(--ink);
        color: var(--bg);
      }
      .soon {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      @media (max-width: 560px) {
        header {
          padding: 16px 20px;
        }
        li {
          padding: 22px 4px;
        }
        .city {
          font-size: 13px;
        }
      }

      /* plaster texture, same on every page */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='5' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        background-size: 1600px 1000px;
        opacity: 0.3;
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">&larr; Home</a><a href="/locations">Locations</a>
    </header>
    <main>
      <a class="logo" href="/"><img src="images/logo.png" alt="AMAI" /></a>
      <h1>Order</h1>
      <p class="sub">Choose your location</p>
      <ul>
        <li>
          <span class="city">Santa Monica</span
          ><a
            class="btn"
            href="https://amaisantamonica.square.site/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Glendale</span
          ><a
            class="btn"
            href="https://amaiglendale.square.site/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Torrance</span
          ><a
            class="btn"
            href="https://amaiteacafe.com/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Huntington Beach</span
          ><a
            class="btn"
            href="https://amaihuntingtonbeach.square.site/?location=L1HZJ0J1RMFHA"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
        <li>
          <span class="city">Sherman Oaks</span
          ><a
            class="btn"
            href="https://amaishermanoaks.square.site/"
            target="_blank"
            rel="noopener"
            >Order here</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
