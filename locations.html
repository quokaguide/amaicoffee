<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locations | AMAI</title>
    <style>
      :root {
        --bg: #f6f4f0;
        --ink: #1a1a1a;
        --muted: #8a867f;
        --line: #d9d5cc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(ellipse at 20% 0%, #fbfaf7 0%, transparent 60%),
          radial-gradient(ellipse at 90% 100%, #ece8e0 0%, transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        padding: 28px 40px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      header a:hover {
        opacity: 0.6;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 80px;
        text-align: center;
      }
      .logo {
        width: min(200px, 50%);
        margin-bottom: 40px;
      }
      .logo img {
        width: 100%;
        display: block;
      }
      h1 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 28px;
      }
      ul {
        list-style: none;
        width: min(520px, 100%);
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
        padding: 26px 8px;
        text-align: left;
      }
      .city {
        display: inline-block;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        position: relative;
      }
      .city::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 0;
        height: 1px;
        background: var(--ink);
        transition: width 0.25s;
      }
      .city:hover::after {
        width: 100%;
      }
      .info {
        margin-top: 12px;
        font-size: 12.5px;
        line-height: 1.9;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .info a {
        transition: color 0.2s;
      }
      .info a:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      @media (max-width: 560px) {
        header {
          padding: 20px;
        }
        li {
          padding: 22px 4px;
        }
        .city {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header><a href="/">&larr; Home</a></header>
    <main>
      <a class="logo" href="/"><img src="images/logo.png" alt="AMAI" /></a>
      <h1>Our Locations</h1>
      <ul>
        <li>
          <a
            class="city"
            href="https://amaisantamonica.square.site/"
            target="_blank"
            rel="noopener"
            >Santa Monica</a
          >
          <div class="info">
            <a
              class="addr"
              data-addr="1701 Pico Blvd, Santa Monica, CA 90405"
              href="#"
              target="_blank"
              rel="noopener"
              >1701 Pico Blvd, Santa Monica, CA 90405</a
            ><br />
            <a href="tel:+13103103797">(310) 310-3797</a>
          </div>
        </li>
        <li>
          <a
            class="city"
            href="https://amaiglendale.square.site/"
            target="_blank"
            rel="noopener"
            >Glendale</a
          >
          <div class="info">
            <a
              class="addr"
              data-addr="4106 San Fernando Rd #H, Glendale, CA 91204"
              href="#"
              target="_blank"
              rel="noopener"
              >4106 San Fernando Rd #H, Glendale, CA 91204</a
            ><br />
            <a href="tel:+18182456600">(818) 245-6600</a>
          </div>
        </li>
        <li>
          <a
            class="city"
            href="https://amaiteacafe.com/"
            target="_blank"
            rel="noopener"
            >Torrance</a
          >
          <div class="info">
            <a
              class="addr"
              data-addr="20210 Anza Ave, Torrance, CA 90503"
              href="#"
              target="_blank"
              rel="noopener"
              >20210 Anza Ave, Torrance, CA 90503</a
            ><br />
            <a href="tel:+14242372372">(424) 237-2372</a>
          </div>
        </li>
      </ul>
    </main>
    <script>
      // Opens Apple Maps on iPhone/iPad/Mac, Google Maps everywhere else (and its app on Android)
      var apple = /iPhone|iPad|iPod|Mac/.test(navigator.userAgent);
      document.querySelectorAll("a.addr").forEach(function (a) {
        var q = encodeURIComponent(a.dataset.addr);
        a.href = apple
          ? "https://maps.apple.com/?q=" + q
          : "https://www.google.com/maps/search/?api=1&query=" + q;
      });
    </script>
  </body>
</html>
