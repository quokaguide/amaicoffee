<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMAI</title>
    <style>
      @font-face {
        font-family: "Gloock";
        src: url(fonts/gloock.woff2) format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --bg: #faf9f6;
        --ink: #1a1a1a;
        --muted: #8a8a86;
        --line: #d9d7d2;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-synthesis: none;
        background: linear-gradient(
          180deg,
          #faf9f6 0%,
          #f9f7f3 70%,
          #f3eee8 100%
        );
        overflow-x: hidden;
      }

      /* full-height photo on the right that fades into the cream page */
      .photo {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 62%;
        background: url(images/hero.jpg) 30% 50% / cover no-repeat;
        -webkit-mask-image:
          linear-gradient(to right, transparent 0%, #000 42%),
          linear-gradient(to bottom, #000 72%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to right, transparent 0%, #000 42%),
          linear-gradient(to bottom, #000 72%, transparent 100%);
        mask-composite: intersect;
        z-index: 0;
      }

      header {
        position: relative;
        z-index: 2;
        height: 70px;
      }
      main {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 5vw 40px;
      }
      .content {
        width: min(520px, 100%);
        margin-left: clamp(40px, 8vw, 150px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .logo {
        width: min(380px, 80%);
        line-height: 0;
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
      }
      .tag {
        margin-top: 34px;
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-size: 22px;
        color: var(--ink);
      }
      nav {
        margin-top: 52px;
        width: min(360px, 100%);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      nav a {
        padding: 26px 8px;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        position: relative;
      }
      nav a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 0;
        height: 1px;
        background: var(--ink);
        transition:
          width 0.25s,
          left 0.25s;
      }
      nav a:hover::after {
        width: 36px;
        left: calc(50% - 18px);
      }

      footer {
        position: relative;
        z-index: 2;
        padding: 24px 40px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      footer a {
        color: inherit;
        text-decoration: none;
      }
      footer a:hover {
        color: var(--ink);
      }

      @media (max-width: 800px) {
        html,
        body {
          height: auto;
        }
        .photo {
          width: 100%;
          height: 55vh;
          bottom: auto;
          background-position: 40% 40%;
          -webkit-mask-image: linear-gradient(
            to bottom,
            #000 55%,
            transparent 100%
          );
          mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
          -webkit-mask-composite: source-over;
          mask-composite: add;
        }
        header {
          height: 40vh;
        }
        main {
          padding: 0 24px 40px;
          justify-content: center;
        }
        .content {
          margin-left: 0;
        }
        .logo {
          width: min(300px, 78%);
        }
      }
      @media (max-width: 560px) {
        footer {
          padding: 20px;
          flex-direction: column;
          gap: 8px;
          align-items: center;
        }
      }

      /* splash intro: logo alone on cream, then fades to the page */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        cursor: pointer;
        transition:
          opacity 0.9s ease,
          visibility 0s linear 0.9s;
      }
      #splash img {
        width: min(340px, 62vw);
        height: auto;
        opacity: 0;
        transform: translateY(6px);
        animation: splashIn 1s ease 0.2s forwards;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
      }
      .seen #splash {
        display: none;
      }
      @keyframes splashIn {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          display: none;
        }
      }
    </style>
    <script>
      // skip the splash if it was already shown this visit
      try {
        if (sessionStorage.getItem("amaiSplash"))
          document.documentElement.classList.add("seen");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="images/logo.png" alt="" />
    </div>
    <div
      class="photo"
      role="img"
      aria-label="Iced coffee in a glass in morning light"
    ></div>
    <header></header>

    <main>
      <div class="content">
        <h1 class="logo"><img src="images/logo.png" alt="AMAI" /></h1>

        <nav>
          <a href="/locations">Locations</a>
          <a href="/about">About</a>
        </nav>
      </div>
    </main>

    <footer>
      <span>Have a sweet day!</span>
      <a href="/contact">Contact</a>
    </footer>
    <script>
      (function () {
        var sp = document.getElementById("splash");
        if (!sp || document.documentElement.classList.contains("seen")) return;
        function done() {
          sp.classList.add("out");
          try {
            sessionStorage.setItem("amaiSplash", "1");
          } catch (e) {}
        }
        setTimeout(done, 2000);
        sp.addEventListener("click", done);
      })();
    </script>
  </body>
</html>
