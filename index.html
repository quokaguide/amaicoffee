<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMAI</title>
    <style>
      @font-face {
        font-family: "Gloock";
        src: url(fonts/gloock.woff2) format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --bg: #faf9f6;
        --ink: #1a1a1a;
        --muted: #8a8a86;
        --line: #d9d7d2;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-synthesis: none;
        background: linear-gradient(
          180deg,
          #faf9f6 0%,
          #f9f7f3 70%,
          #f3eee8 100%
        );
        overflow-x: hidden;
      }

      header {
        position: relative;
        z-index: 2;
        height: 70px;
      }
      main {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5vw 40px;
      }
      .content {
        width: min(520px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .logo {
        width: min(380px, 80%);
        line-height: 0;
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
        animation: hop 1s ease-out 0.4s 1;
        position: relative;
        z-index: 5;
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      .logo img.grab {
        cursor: grabbing;
      }
      @keyframes hop {
        0% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-16px);
        }
        50% {
          transform: translateY(0);
        }
        68% {
          transform: translateY(-6px);
        }
        84% {
          transform: translateY(0);
        }
        92% {
          transform: translateY(-2px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .tag {
        margin-top: 34px;
        font-family: "Gloock", Georgia, "Times New Roman", serif;
        font-size: 22px;
        color: var(--ink);
      }
      nav {
        margin-top: 52px;
        width: min(360px, 100%);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      nav a {
        padding: 26px 8px;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        position: relative;
      }
      nav a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 0;
        height: 1px;
        background: var(--ink);
        transition:
          width 0.25s,
          left 0.25s;
      }
      nav a:hover::after {
        width: 36px;
        left: calc(50% - 18px);
      }

      footer {
        position: relative;
        z-index: 2;
        padding: 24px 40px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      footer a {
        color: inherit;
        text-decoration: none;
      }
      footer a:hover {
        color: var(--ink);
      }

      @media (max-width: 800px) {
        html,
        body {
          height: auto;
        }
        header {
          height: 12vh;
        }
        main {
          padding: 0 24px 40px;
          justify-content: center;
        }
        .logo {
          width: min(300px, 78%);
        }
      }
      @media (max-width: 560px) {
        footer {
          padding: 20px;
          flex-direction: column;
          gap: 8px;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <header></header>

    <main>
      <div class="content">
        <h1 class="logo"><img src="images/logo.png" alt="AMAI" /></h1>

        <nav>
          <a href="/locations">Locations</a>
          <a href="/about">About</a>
        </nav>
      </div>
    </main>

    <footer>
      <span>Have a sweet day!</span>
      <a href="/contact">Contact</a>
    </footer>
    <script>
      // grab the logo and drag it anywhere; let go and it springs back. A simple click makes it hop again.
      (function () {
        var img = document.querySelector(".logo img");
        var x = 0,
          y = 0,
          sx = 0,
          sy = 0,
          drag = false,
          moved = 0,
          back = null;
        img.draggable = false;

        img.addEventListener("pointerdown", function (e) {
          drag = true;
          moved = 0;
          sx = e.clientX - x;
          sy = e.clientY - y;
          img.setPointerCapture(e.pointerId);
          img.style.animation = "none";
          if (back) back.cancel();
          img.classList.add("grab");
          e.preventDefault();
        });

        img.addEventListener("pointermove", function (e) {
          if (!drag) return;
          x = e.clientX - sx;
          y = e.clientY - sy;
          moved = Math.max(moved, Math.hypot(x, y));
          img.style.transform =
            "translate(" + x + "px," + y + "px) scale(1.04)";
        });

        function release() {
          if (!drag) return;
          drag = false;
          img.classList.remove("grab");
          if (moved < 4) {
            // just a click: hop in place
            x = y = 0;
            img.style.transform = "";
            img.style.animation = "none";
            void img.offsetWidth;
            img.style.animation = "hop 1s ease-out 0s 1";
            return;
          }
          var from = "translate(" + x + "px," + y + "px) scale(1.04)";
          back = img.animate(
            [{ transform: from }, { transform: "translate(0,0) scale(1)" }],
            { duration: 700, easing: "cubic-bezier(.34,1.8,.5,1)" },
          );
          x = y = 0;
          img.style.transform = "";
        }
        img.addEventListener("pointerup", release);
        img.addEventListener("pointercancel", release);
      })();
    </script>
  </body>
</html>
