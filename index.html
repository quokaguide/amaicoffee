<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMAI</title>
    <style>
      :root {
        --bg: #dddedc;
        --ink: #1a1a1a;
        --muted: #6b6d6a;
        --line: #bfc1be;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        display: flex;
        justify-content: flex-end;
        padding: 28px 40px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      header a {
        color: var(--ink);
        text-decoration: none;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        width: 100%;
        padding: 0 5vw 40px;
      }
      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .cup-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cup {
        height: min(74vh, 720px);
        width: auto;
        max-width: 100%;
        display: block;
        /* feather the photo edges so the marble melts into the page */
        -webkit-mask-image: radial-gradient(
          ellipse closest-side at 50% 50%,
          #000 80%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse closest-side at 50% 50%,
          #000 80%,
          transparent 100%
        );
      }
      .logo {
        width: min(380px, 80%);
        line-height: 0;
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
      }
      .sub {
        margin-top: 26px;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tag {
        margin-top: 40px;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 22px;
        color: var(--ink);
      }
      nav {
        margin-top: 56px;
        width: min(360px, 100%);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      nav a {
        padding: 26px 8px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        position: relative;
        transition: color 0.2s;
      }
      nav a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 0;
        height: 1px;
        background: var(--ink);
        transition:
          width 0.25s,
          left 0.25s;
      }
      nav a:hover::after {
        width: 36px;
        left: calc(50% - 18px);
      }
      footer {
        padding: 24px 40px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      footer a {
        color: inherit;
        text-decoration: none;
      }
      footer a:hover {
        color: var(--ink);
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          padding: 0 24px 40px;
          gap: 36px;
        }
        .cup-wrap {
          order: -1;
        }
        .cup {
          height: 46vh;
        }
      }
      @media (max-width: 560px) {
        header {
          padding: 20px;
        }
        footer {
          padding: 20px;
          flex-direction: column;
          gap: 8px;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <header></header>

    <main>
      <div class="content">
        <h1 class="logo"><img src="images/logo.png" alt="AMAI" /></h1>
        <p class="tag">Asian inspired &amp; thoughtfully crafted</p>

        <nav>
          <a href="/locations">Locations</a>
          <a href="/order">Order</a>
        </nav>
      </div>
      <div class="cup-wrap">
        <img
          class="cup"
          src="images/hero-marble.jpg"
          alt="Latte in an amai cup"
        />
      </div>
    </main>

    <footer>
      <span>Have a sweet day!</span>
      <a
        href="https://amaisantamonica.square.site/"
        target="_blank"
        rel="noopener"
        >Contact</a
      >
    </footer>
  </body>
</html>
